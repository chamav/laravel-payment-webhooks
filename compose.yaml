name: laravel-payment-webhooks

services:
  app:
    build: .
    image: laravel-payment-webhooks-app:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    environment:
      PHP_CLI_SERVER_WORKERS: "${PHP_CLI_SERVER_WORKERS:-4}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 30

  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: "${DB_DATABASE:-webhooks}"
      POSTGRES_USER: "${DB_USERNAME:-webhooks}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is empty, run make setup}"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  # Separate server and credentials for tests; data lives in memory and is gone after restart.
  db-test:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: webhooks_test
      POSTGRES_USER: webhooks_test
      POSTGRES_PASSWORD: webhooks_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
