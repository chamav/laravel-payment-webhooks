name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, static analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the app with Docker Compose
        run: make setup

      - name: Migrate the test database
        run: make migrate-test

      - name: Run checks and tests
        run: make verify ARGS="--log-junit storage/framework/testing/junit.xml"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpunit-junit
          path: storage/framework/testing/junit.xml
          if-no-files-found: warn
